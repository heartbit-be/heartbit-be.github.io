name: Check website
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Verify staging output
        run: npm run build && node scripts/verify-build.mjs
        env:
          SITE_URL: https://staging.heartbit.be
          PUBLIC_SITE_ENV: staging
